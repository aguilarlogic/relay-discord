[project]
name = "relay"
version = "0.1.0"
description = "Relay: an AI support desk for Discord communities that answers from your own docs"
readme = "README.md"
requires-python = "==3.12.*"
dependencies = [
    "discord.py>=2.4",
    "anthropic>=1.0",
    "aiosqlite>=0.20",
    "pydantic-settings>=2.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[project.scripts]
relay = "relay.__main__:main"

[build-system]
requires = ["uv_build>=0.8.0,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
